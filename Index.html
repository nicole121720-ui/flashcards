<!DOCTYPE html>
<html>
<head>
<style>
body{display:flex;gap:20px;justify-content:center;padding:50px;background:#f0f0f0}
.card{width:150px;height:200px;perspective:1000px}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:0.6s}
.card:hover .inner,.card:focus-within .inner{transform:rotateY(180deg)}
.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:bold;font-family:sans-serif}
.front{background:white;color:#333;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
.back{background:#6c5ce7;color:white;transform:rotateY(180deg)}
</style>
</head>
<body>
<div class="card" tabindex="0"><div class="inner"><div class="front">HTML</div><div class="back">Cria o site</div></div></div>
<div class="card" tabindex="0"><div class="inner"><div class="front">CSS</div><div class="back">Deixa bonito</div></div></div>
<div class="card" tabindex="0"><div class="inner"><div class="front">JS</div><div class="back">Faz mexer</div></div></div>
</body>
</html>
